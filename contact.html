<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tripathi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(120deg, #00c6ff, #0072ff);
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
        }
        header .logo {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }
        header nav a {
            margin-left: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        header nav a:hover {
            color: #f7d354;
        }
        .main-content {
            flex: 1;
            text-align: center;
            padding: 80px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            margin-top: 40px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .main-content h1 {
            font-size: 50px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 700;
            color: #f7d354;
        }
        .main-content p {
            font-size: 18px;
            margin-bottom: 40px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }
        .contact-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .contact-form, .contact-info {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            flex: 1;
            max-width: 550px;
            text-align: left;
            margin-top: 30px;
        }
        .contact-form h2, .contact-info h2 {
            font-size: 24px;
            color: #f7d354;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .contact-form form input, .contact-form form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #fff;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            transition: background 0.3s, border 0.3s;
        }
        .contact-form form input:focus, .contact-form form textarea:focus {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #f7d354;
        }
        .contact-form form button {
            background: #00c6ff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .contact-form form button:hover {
            background: #005bea;
            transform: scale(1.05);
        }
        .contact-info p {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .contact-info .map {
            background: rgba(0, 0, 0, 0.6);
            height: 220px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
        }
        footer {
            background: rgba(0, 0, 0, 0.9);
            color: #f7d354;
            text-align: center;
            padding: 30px 20px;
            font-size: 16px;
        }
        footer .footer-info {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        footer .footer-info div {
            text-align: center;
        }
        footer .footer-info p {
            margin: 5px 0;
        }
        footer a {
            color: #f7d354;
            text-decoration: none;
            font-weight: bold;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-form, .contact-info {
                max-width: 100%;
            }
            footer .footer-info {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Tripathi Weather App</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="weather.html">Weather</a>
        </nav>
    </header>
    <div class="main-content">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Please feel free to get in touch with any questions or feedback.</p>
        <div class="contact-container">
            <div class="contact-form">
                <h2>Send us a Message</h2>
                <form>
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>
            <!-- <div class="contact-info">
                <h2>Contact Information</h2>
                <p><strong>Address:</strong> 123, Your Street, Your City</p>
                <p><strong>Phone:</strong> +91 1234567890</p>
                <p><strong>Email:</strong> tripathi@example.com</p>
                <div class="map">Map Placeholder</div>
            </div> -->
        </div>
    </div>
    <footer>
        <div class="footer-info">
            <!-- <div>
                <p><strong>Address:</strong></p>
                <p>123, Your Street</p>
                <p>Your City, Your State</p>
            </div>
            <div>
                <p><strong>Phone:</strong></p>
                <p>+91 1234567890</p>
            </div>
            <div>
                <p><strong>Email:</strong></p>
                <p><a href="mailto:tripathi@example.com">tripathi@example.com</a></p>
            </div> -->
        </div>
        <p>&copy; 2025 Tripathi | Built with ❤️ | <a href="#">Privacy Policy</a></p>
    </footer>
</body>
</html>
